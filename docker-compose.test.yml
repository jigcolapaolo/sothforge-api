services:
  postgres-test:
    image: postgres:17-alpine
    container_name: sothforge-postgres-test
    environment:
      POSTGRES_USER: sothforge_test
      POSTGRES_PASSWORD: sothforge_test
      POSTGRES_DB: sothforge_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data: